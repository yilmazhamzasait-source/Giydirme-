<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Manken Giydir</title>
<style>
  :root{
    --bg:#eceae6; --panel:#ffffff; --text:#1f1f1f; --muted:#6b6b6b;
    --line:#e2e0dc; --accent:#3d5afe; --accent-soft:#e8ecff;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1b1c1f; --panel:#26272b; --text:#f1f1f1; --muted:#a2a2a8;
      --line:#35363b; --accent:#7c8dff; --accent-soft:#2e3252; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #app{display:flex;height:100%;width:100%}
  #stage{position:relative;flex:1;min-width:0;min-height:0}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none}
  #views{position:absolute;top:12px;left:50%;transform:translateX(-50%);
    display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.08)}
  #views button{border:0;background:transparent;color:var(--text);padding:8px 14px;
    border-radius:8px;font-size:14px;cursor:pointer}
  #views button:hover{background:var(--accent-soft)}
  #hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;
    font-size:12px;color:var(--muted);pointer-events:none}
  #panel{width:320px;background:var(--panel);border-left:1px solid var(--line);
    overflow-y:auto;padding:18px 18px 28px}
  h1{font-size:18px;margin:0 0 4px}
  .sub{font-size:13px;color:var(--muted);margin:0 0 18px}
  .sec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
  .sec h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
  .uploads{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .drop{position:relative;aspect-ratio:3/4;border:1.5px dashed var(--line);border-radius:12px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    font-size:13px;color:var(--muted);cursor:pointer;overflow:hidden;background-size:contain;
    background-position:center;background-repeat:no-repeat;text-align:center;padding:6px}
  .drop.has{border-style:solid;color:transparent}
  .drop input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:1;font-size:100px}
  .drop .x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;z-index:2;
    border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:28px;display:none;cursor:pointer}
  #status{position:absolute;top:64px;left:12px;right:12px;margin:auto;max-width:420px;display:none;
    background:#fff4e5;color:#6b3d00;border:1px solid #f3c98b;border-radius:10px;padding:10px 12px;
    font-size:13px;line-height:1.4;z-index:5}
  #status.show{display:block}
  #status.ok{background:#e9f7ee;color:#1d5b33;border-color:#a6d8b8}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:14px;pointer-events:none}
  .drop.has .x{display:block}
  .drop b{font-size:22px;font-weight:400;color:var(--accent)}
  .drop.has b{color:transparent}
  label.row{display:block;font-size:13px;margin:10px 0 2px}
  label.row span{float:right;color:var(--muted);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .chk{display:flex;align-items:center;gap:8px;font-size:14px;margin:8px 0;cursor:pointer}
  .chk input{width:18px;height:18px;accent-color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips label{display:flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--line);
    border-radius:999px;padding:6px 12px;cursor:pointer;user-select:none}
  .chips input{display:none}
  .chips label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .btns{display:flex;gap:8px;margin-top:4px}
  .btn{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--text);
    padding:10px;border-radius:10px;font-size:14px;cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .swatch{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--line);vertical-align:-2px;margin-left:6px}
  #toggle{display:none}

  @media (max-width:760px){
    #app{flex-direction:column}
    #panel{width:100%;height:46%;border-left:0;border-top:1px solid var(--line);padding:14px 16px 24px}
    #app.collapsed #panel{height:0;padding:0;border:0;overflow:hidden}
    #toggle{display:block;position:absolute;right:12px;bottom:12px;border:0;background:var(--accent);
      color:#fff;border-radius:999px;padding:10px 16px;font-size:14px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
    #hint{bottom:60px}
    #views button{padding:8px 10px}
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="views">
      <button data-view="front">Ön</button>
      <button data-view="side">Yan</button>
      <button data-view="back">Arka</button>
      <button data-view="spin" id="spinBtn">Döndür</button>
    </div>
    <div id="hint">Sürükle: döndür · İki parmak / tekerlek: yakınlaştır</div>
    <div id="loading">3D manken yükleniyor…</div>
    <div id="status"></div>
    <button id="toggle">Ayarlar</button>
  </div>

  <aside id="panel">
    <h1>Manken Giydir</h1>
    <p class="sub">Resmi yükle, manken üstüne önden yansıtılsın.</p>

    <div class="uploads">
      <div class="drop" id="dropFront">
        <b>+</b>Ön resim
        <input type="file" accept="image/*" id="fileFront">
        <button class="x" data-clear="front" title="Kaldır">×</button>
      </div>
      <div class="drop" id="dropBack">
        <b>+</b>Arka resim<br><small>(isteğe bağlı)</small>
        <input type="file" accept="image/*" id="fileBack">
        <button class="x" data-clear="back" title="Kaldır">×</button>
      </div>
    </div>

    <div class="sec">
      <h2>Konum</h2>
      <label class="row">Boyut <span id="vScale"></span></label>
      <input type="range" id="scale" min="0.2" max="2.2" step="0.01">
      <label class="row">Yukarı / aşağı <span id="vY"></span></label>
      <input type="range" id="posY" min="0" max="2" step="0.005">
      <label class="row">Sağa / sola <span id="vX"></span></label>
      <input type="range" id="posX" min="-0.5" max="0.5" step="0.005">
      <label class="row">En (sıkıştır / genişlet) <span id="vW"></span></label>
      <input type="range" id="stretch" min="0.5" max="1.6" step="0.01">
    </div>

    <div class="sec">
      <h2>Arka plan</h2>
      <label class="chk"><input type="checkbox" id="keyOn" checked> Resmin arka planını sil <i class="swatch" id="keySwatch"></i></label>
      <label class="row">Silme hassasiyeti <span id="vTol"></span></label>
      <input type="range" id="tol" min="0" max="0.5" step="0.005">
      <label class="chk"><input type="checkbox" id="mirrorBack" checked> Arka resim yoksa ön resmi arkaya da yansıt</label>
    </div>

    <div class="sec">
      <h2>Nerelere giysin</h2>
      <div class="chips">
        <label><input type="checkbox" data-part="torso" checked>Gövde</label>
        <label><input type="checkbox" data-part="arms" checked>Kollar</label>
        <label><input type="checkbox" data-part="legs" checked>Bacaklar</label>
        <label><input type="checkbox" data-part="head">Kafa</label>
      </div>
    </div>

    <div class="sec">
      <h2>Kaydet</h2>
      <div class="btns">
        <button class="btn primary" id="shot">Görüntüyü indir</button>
        <button class="btn" id="reset">Sıfırla</button>
      </div>
    </div>
  </aside>
</div>

<script>
/* Resim yükleme: 3D kütüphanesinden bağımsız, hep çalışır */
(function(){
  var st = document.getElementById('status'), hideT;
  window.showStatus = function(msg, ok){
    clearTimeout(hideT);
    st.textContent = msg; st.className = 'show' + (ok ? ' ok' : '');
    if (ok) hideT = setTimeout(function(){ st.className = ''; }, 2500);
  };
  window.__imgs = { front:null, back:null };
  function drop(which){ return document.getElementById(which === 'front' ? 'dropFront' : 'dropBack'); }

  function handle(which, file){
    if (!file) return;
    var name = (file.name || '').toLowerCase();
    var isHeic = /heic|heif/.test(file.type) || /\.(heic|heif)$/.test(name);
    var url = URL.createObjectURL(file);
    var im = new Image();
    im.onload = function(){
      var max = 2048, s = Math.min(1, max / Math.max(im.width, im.height));
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(im.width * s));
      c.height = Math.max(1, Math.round(im.height * s));
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      var old = window.__imgs[which]; if (old) URL.revokeObjectURL(old.url);
      window.__imgs[which] = { canvas:c, url:url };
      var d = drop(which); d.style.backgroundImage = 'url(' + url + ')'; d.classList.add('has');
      document.dispatchEvent(new CustomEvent('img-ready', { detail:{ which:which } }));
      if (window.__3dReady) showStatus('Resim yüklendi ✓', true);
      else showStatus('Resim yüklendi, 3D manken hâlâ yükleniyor…');
    };
    im.onerror = function(){
      URL.revokeObjectURL(url);
      showStatus(isHeic
        ? 'Bu fotoğraf HEIC formatında, tarayıcı açamıyor. Ekran görüntüsünü al ya da JPG/PNG olarak kaydedip tekrar dene.'
        : 'Bu dosya açılamadı. JPG veya PNG bir resim dene.');
    };
    im.src = url;
  }

  [['fileFront','front'],['fileBack','back']].forEach(function(p){
    var inp = document.getElementById(p[0]);
    inp.addEventListener('change', function(){ handle(p[1], inp.files && inp.files[0]); inp.value = ''; });
    var d = drop(p[1]);
    d.addEventListener('dragover', function(e){ e.preventDefault(); });
    d.addEventListener('drop', function(e){ e.preventDefault(); handle(p[1], e.dataTransfer.files[0]); });
  });
  document.querySelectorAll('.x').forEach(function(b){
    b.addEventListener('click', function(e){
      e.preventDefault(); e.stopPropagation();
      var w = b.dataset.clear, old = window.__imgs[w];
      if (old) URL.revokeObjectURL(old.url);
      window.__imgs[w] = null;
      var d = drop(w); d.style.backgroundImage = ''; d.classList.remove('has');
      document.dispatchEvent(new CustomEvent('img-clear', { detail:{ which:w } }));
    });
  });

  setTimeout(function(){
    if (!window.__3dReady) {
      document.getElementById('loading').textContent = '';
      showStatus('3D manken yüklenemedi. İnternet bağlantını kontrol edip sayfayı yenile. Tarayıcı çok eskiyse güncellemen gerekebilir.');
    }
  }, 15000);
})();
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- Sahne ---------------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true, alpha:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 50);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1.0, 0);
controls.minDistance = 0.8;
controls.maxDistance = 8;
controls.enablePan = true;
camera.position.set(0, 1.15, 4.4);

const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(2, 4, 3);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -1.5; key.shadow.camera.right = 1.5;
key.shadow.camera.top = 2.5; key.shadow.camera.bottom = -0.5;
key.shadow.bias = -0.0005;
scene.add(key);
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d4cc, 0.5));

const floor = new THREE.Mesh(new THREE.CircleGeometry(3, 64), new THREE.ShadowMaterial({ opacity:0.12 }));
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

/* ---------------- Yansıtma malzemesi ---------------- */
const blank = new THREE.DataTexture(new Uint8Array([255,255,255,0]), 1, 1);
blank.needsUpdate = true;

const U = {
  uFront:{ value: blank }, uBack:{ value: blank },
  uHasFront:{ value: 0 }, uHasBack:{ value: 0 },
  uCenter:{ value: new THREE.Vector2(0, 1.2) },
  uSizeF:{ value: new THREE.Vector2(0.8, 0.8) },
  uSizeB:{ value: new THREE.Vector2(0.8, 0.8) },
  uKeyOn:{ value: 1 }, uTol:{ value: 0.12 },
  uKeyF:{ value: new THREE.Color(1,1,1) }, uKeyB:{ value: new THREE.Color(1,1,1) },
  uMirror:{ value: 1 },
};

function makeProjMaterial(){
  const m = new THREE.MeshStandardMaterial({ color:0xf7f6f3, roughness:0.55, metalness:0 });
  m.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, U);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
        varying vec3 vWPos; varying vec3 vWNrm;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        vWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
        vWNrm = normalize(mat3(modelMatrix) * objectNormal);`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        varying vec3 vWPos; varying vec3 vWNrm;
        uniform sampler2D uFront; uniform sampler2D uBack;
        uniform float uHasFront; uniform float uHasBack;
        uniform vec2 uCenter; uniform vec2 uSizeF; uniform vec2 uSizeB;
        uniform float uKeyOn; uniform float uTol; uniform vec3 uKeyF; uniform vec3 uKeyB;
        uniform float uMirror;
        vec4 sampleProj(sampler2D t, vec2 uv, vec3 keyc){
          if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) return vec4(0.0);
          vec4 c = texture2D(t, uv);
          float a = c.a;
          if (uKeyOn > 0.5) {
            float d = distance(sqrt(max(c.rgb,0.0)), sqrt(keyc));
            a *= smoothstep(uTol, uTol + 0.06, d);
          }
          return vec4(c.rgb, a);
        }`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        {
          vec3 n = normalize(vWNrm);
          float wF = smoothstep(-0.12, 0.12, n.z);
          vec2 uvF = (vWPos.xy - uCenter) / uSizeF + 0.5;
          vec4 f = uHasFront > 0.5 ? sampleProj(uFront, uvF, uKeyF) : vec4(0.0);
          vec4 b = vec4(0.0);
          if (uHasBack > 0.5) {
            vec2 uvB = (vWPos.xy - uCenter) / uSizeB + 0.5;
            uvB.x = 1.0 - uvB.x;               // arkadan bakınca sağ-sol ters
            b = sampleProj(uBack, uvB, uKeyB);
          } else if (uMirror > 0.5 && uHasFront > 0.5) {
            b = f;                              // ön resim arkaya geçer
          }
          vec4 p = mix(b, f, wF);
          diffuseColor.rgb = mix(diffuseColor.rgb, p.rgb, p.a);
        }`);
  };
  return m;
}

const projMat = makeProjMaterial();
const plainMat = new THREE.MeshStandardMaterial({ color:0xf7f6f3, roughness:0.55, metalness:0 });
const standMat = new THREE.MeshStandardMaterial({ color:0xcfccc6, roughness:0.35, metalness:0.2 });

/* ---------------- Manken ---------------- */
const mannequin = new THREE.Group();
scene.add(mannequin);
const parts = { torso:[], arms:[], legs:[], head:[] };

function add(geo, part, pos, rot, scl){
  const m = new THREE.Mesh(geo, projMat);
  if (pos) m.position.copy(pos);
  if (rot) m.rotation.set(rot.x||0, rot.y||0, rot.z||0);
  if (scl) m.scale.copy(scl);
  m.castShadow = true; m.receiveShadow = true;
  mannequin.add(m); parts[part].push(m);
  return m;
}
const V = (x,y,z) => new THREE.Vector3(x,y,z);

// Gövde: kalçadan omza tornalanmış profil (yarıçap, yükseklik)
const torsoProfile = [
  [0.000,0.00],[0.100,0.005],[0.150,0.03],[0.170,0.08],[0.172,0.14],
  [0.160,0.22],[0.140,0.30],[0.132,0.36],[0.138,0.42],[0.150,0.48],
  [0.160,0.54],[0.163,0.58],[0.150,0.62],[0.110,0.655],[0.060,0.675],[0.000,0.68]
].map(([r,y]) => new THREE.Vector2(r, y));
const torsoGeo = new THREE.LatheGeometry(torsoProfile, 64);
add(torsoGeo, 'torso', V(0, 0.86, 0), null, V(1.12, 1, 0.66));

// Omuz yuvarlakları
const shoulderGeo = new THREE.SphereGeometry(0.068, 32, 20);
add(shoulderGeo, 'torso', V(-0.185, 1.45, 0), null, V(1,0.9,1));
add(shoulderGeo, 'torso', V( 0.185, 1.45, 0), null, V(1,0.9,1));

// Boyun + kafa
add(new THREE.CylinderGeometry(0.045, 0.055, 0.12, 32), 'head', V(0, 1.575, 0));
add(new THREE.SphereGeometry(0.105, 48, 32), 'head', V(0, 1.72, 0.005), null, V(0.86, 1.08, 0.95));

// Kollar (hafif A duruşu)
function arm(side){
  const s = side;
  const g = new THREE.Group();
  g.position.set(0.195*s, 1.44, 0);
  g.rotation.z = 0.16*s;
  mannequin.add(g);
  const mk = (geo, y, rz=0, sc) => {
    const m = new THREE.Mesh(geo, projMat);
    m.position.y = y; m.rotation.z = rz;
    if (sc) m.scale.copy(sc);
    m.castShadow = true; g.add(m); parts.arms.push(m); return m;
  };
  mk(new THREE.CapsuleGeometry(0.048, 0.24, 8, 24), -0.16);
  const fore = new THREE.Group(); fore.position.y = -0.31; fore.rotation.z = -0.06*s; g.add(fore);
  const f = new THREE.Mesh(new THREE.CapsuleGeometry(0.04, 0.22, 8, 24), projMat);
  f.position.y = -0.14; f.castShadow = true; fore.add(f); parts.arms.push(f);
  const h = new THREE.Mesh(new THREE.SphereGeometry(0.045, 24, 16), projMat);
  h.position.y = -0.31; h.scale.set(0.7, 1.35, 1.05); h.castShadow = true; fore.add(h); parts.arms.push(h);
}
arm(-1); arm(1);

// Bacaklar
function leg(side){
  const s = side;
  const g = new THREE.Group(); g.position.set(0.085*s, 0.9, 0); g.rotation.z = 0.02*s; mannequin.add(g);
  const th = new THREE.Mesh(new THREE.CapsuleGeometry(0.075, 0.30, 8, 28), projMat);
  th.position.y = -0.2; th.scale.set(1, 1, 0.95); th.castShadow = true; g.add(th); parts.legs.push(th);
  const sh = new THREE.Mesh(new THREE.CapsuleGeometry(0.052, 0.33, 8, 24), projMat);
  sh.position.y = -0.62; sh.castShadow = true; g.add(sh); parts.legs.push(sh);
  const ft = new THREE.Mesh(new THREE.CapsuleGeometry(0.04, 0.1, 6, 16), projMat);
  ft.position.set(0, -0.862, 0.05); ft.rotation.x = Math.PI/2; ft.scale.set(1, 1, 0.7);
  ft.castShadow = true; g.add(ft); parts.legs.push(ft);
}
leg(-1); leg(1);

// Kalça bağlantısı (bacak ile gövde arası boşluğu kapatır)
add(new THREE.SphereGeometry(0.16, 40, 24), 'torso', V(0, 0.88, 0), null, V(1.18, 0.55, 0.72));

// Ayaklık
const base = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.025, 64), standMat);
base.position.y = 0.0125; base.receiveShadow = true; scene.add(base);
mannequin.position.y = 0.025;

/* ---------------- Durum ---------------- */
const DEF = { scale:0.95, posY:1.18, posX:0, stretch:1, tol:0.12, keyOn:true, mirror:true,
  parts:{ torso:true, arms:true, legs:true, head:false } };
const S = structuredClone(DEF);
const img = { front:null, back:null };  // {tex, aspect, url}

function applyParts(){
  for (const [k, arr] of Object.entries(parts))
    arr.forEach(m => m.material = S.parts[k] ? projMat : plainMat);
}
function applyUniforms(){
  U.uCenter.value.set(S.posX, S.posY);
  const setSize = (v, it) => {
    const a = it ? it.aspect : 1;            // genişlik / yükseklik
    v.set(S.scale * a * S.stretch, S.scale);
  };
  setSize(U.uSizeF.value, img.front);
  setSize(U.uSizeB.value, img.back || img.front);
  U.uTol.value = S.tol;
  U.uKeyOn.value = S.keyOn ? 1 : 0;
  U.uMirror.value = S.mirror ? 1 : 0;
  U.uHasFront.value = img.front ? 1 : 0;
  U.uHasBack.value = img.back ? 1 : 0;
  U.uFront.value = img.front ? img.front.tex : blank;
  U.uBack.value = img.back ? img.back.tex : blank;
}

/* ---------------- Resim yükleme ---------------- */
function cornerColor(image){
  const c = document.createElement('canvas');
  const w = 64, h = Math.max(1, Math.round(64 * image.height / image.width));
  c.width = w; c.height = h;
  const x = c.getContext('2d', { willReadFrequently:true });
  x.drawImage(image, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h).data;
  let r=0,g=0,b=0,n=0;
  const px = (i,j) => { const o = (j*w+i)*4; if (d[o+3] < 20) return; r+=d[o]; g+=d[o+1]; b+=d[o+2]; n++; };
  for (let i=0;i<w;i++){ px(i,0); px(i,1); px(i,h-1); px(i,h-2); }
  for (let j=0;j<h;j++){ px(0,j); px(1,j); px(w-1,j); px(w-2,j); }
  if (!n) return new THREE.Color(1,1,1);
  return new THREE.Color().setRGB(r/n/255, g/n/255, b/n/255, THREE.SRGBColorSpace);
}

// Resimler yükleyici betikten gelir (3D'den bağımsız çalışır)
function useImage(which){
  const it = window.__imgs[which];
  if (img[which]) { img[which].tex.dispose(); img[which] = null; }
  if (it) {
    const tex = new THREE.CanvasTexture(it.canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    img[which] = { tex, aspect: it.canvas.width / it.canvas.height };
    const kc = cornerColor(it.canvas);
    (which === 'front' ? U.uKeyF : U.uKeyB).value.copy(kc);
    if (which === 'front') document.getElementById('keySwatch').style.background = '#' + kc.getHexString(THREE.SRGBColorSpace);
  }
  applyUniforms();
}
document.addEventListener('img-ready', e => useImage(e.detail.which));
document.addEventListener('img-clear', e => useImage(e.detail.which));

/* ---------------- Kontroller ---------------- */
const $ = id => document.getElementById(id);
const sliders = [
  ['scale','vScale', v => v.toFixed(2)], ['posY','vY', v => v.toFixed(2)],
  ['posX','vX', v => v.toFixed(2)], ['stretch','vW', v => '%' + Math.round(v*100)],
  ['tol','vTol', v => Math.round(v*200)],
];
function syncUI(){
  for (const [k, lab, fmt] of sliders){ $(k).value = S[k]; $(lab).textContent = fmt(+S[k]); }
  $('keyOn').checked = S.keyOn; $('mirrorBack').checked = S.mirror;
  document.querySelectorAll('[data-part]').forEach(c => c.checked = S.parts[c.dataset.part]);
}
for (const [k, lab, fmt] of sliders){
  $(k).addEventListener('input', e => { S[k] = +e.target.value; $(lab).textContent = fmt(S[k]); applyUniforms(); save(); });
}
$('keyOn').addEventListener('change', e => { S.keyOn = e.target.checked; applyUniforms(); save(); });
$('mirrorBack').addEventListener('change', e => { S.mirror = e.target.checked; applyUniforms(); save(); });
document.querySelectorAll('[data-part]').forEach(c => c.addEventListener('change', () => {
  S.parts[c.dataset.part] = c.checked; applyParts(); save();
}));
$('reset').addEventListener('click', () => {
  Object.assign(S, structuredClone(DEF)); syncUI(); applyUniforms(); applyParts(); save(); setView('front');
});

// Ayarları tarayıcıda hatırla (resimler hariç)
function save(){ try { localStorage.setItem('manken-giydir', JSON.stringify(S)); } catch(e){} }
try { const s = JSON.parse(localStorage.getItem('manken-giydir') || 'null');
  if (s) { Object.assign(S, s, { parts:{ ...DEF.parts, ...(s.parts||{}) } }); } } catch(e){}

/* ---------------- Kamera görünümleri ---------------- */
let spinning = false, anim = null;
function setView(v){
  const d = camera.position.distanceTo(controls.target);
  const ang = { front:0, side:Math.PI/2, back:Math.PI }[v];
  const from = Math.atan2(camera.position.x - controls.target.x, camera.position.z - controls.target.z);
  let to = ang, delta = ((to - from + Math.PI*3) % (Math.PI*2)) - Math.PI;
  const y0 = camera.position.y, y1 = controls.target.y + 0.15;
  const t0 = performance.now();
  anim = (now) => {
    const t = Math.min(1, (now - t0) / 600), e = t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
    const a = from + delta*e, flat = Math.sqrt(Math.max(0.01, d*d - (y1-controls.target.y)**2));
    camera.position.set(controls.target.x + Math.sin(a)*flat, y0 + (y1-y0)*e, controls.target.z + Math.cos(a)*flat);
    if (t >= 1) anim = null;
  };
}
document.querySelectorAll('#views button').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.view === 'spin') { spinning = !spinning; b.style.background = spinning ? 'var(--accent-soft)' : ''; return; }
  spinning = false; $('spinBtn').style.background = ''; setView(b.dataset.view);
}));

$('toggle').addEventListener('click', () => { document.getElementById('app').classList.toggle('collapsed'); setTimeout(resize, 30); });

$('shot').addEventListener('click', () => {
  renderer.render(scene, camera);
  const a = document.createElement('a');
  a.download = 'manken.png';
  a.href = renderer.domElement.toDataURL('image/png');
  a.click();
});

/* ---------------- Döngü ---------------- */
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

syncUI(); applyParts(); applyUniforms(); resize();
useImage('front'); useImage('back');
window.__3dReady = true;
document.getElementById('loading').remove();
renderer.setAnimationLoop((now) => {
  if (anim) anim(now);
  if (spinning) {
    const off = camera.position.clone().sub(controls.target);
    off.applyAxisAngle(new THREE.Vector3(0,1,0), 0.008);
    camera.position.copy(controls.target).add(off);
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
